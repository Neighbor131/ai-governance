<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book an AI Governance Snapshot</title>
    <meta
      name="description"
      content="Book an AI Governance Snapshot for your product team."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="contact-page">
    <header class="site-header" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="AI Governance Studio home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>AI Governance Studio</span>
      </a>
      <nav class="desktop-nav" aria-label="Sections">
        <a href="index.html#services">Services</a>
        <a href="index.html#process">Process</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="index.html#faq">FAQ</a>
      </nav>
      <a class="nav-cta" href="contact.html">Book a snapshot</a>
      <button class="menu-button" type="button" aria-label="Open menu">
        <span></span>
        <span></span>
      </button>
    </header>

    <main>
      <section class="contact-hero" aria-labelledby="contact-title">
        <div class="contact-bg" aria-hidden="true"></div>
        <div class="contact-fade" aria-hidden="true"></div>
        <div class="contact-shell reveal">
          <a class="back-link" href="index.html">Back to overview</a>
          <h1 id="contact-title">Get started</h1>
          <p class="contact-subtitle">Fill out the form and we will reach out to you soon.</p>

          <form class="contact-form" action="mailto:hello@example.com" method="post" enctype="text/plain">
            <label>
              <span>Name *</span>
              <input name="name" type="text" placeholder="Name *" required autofocus />
            </label>

            <label>
              <span>Business email *</span>
              <input name="email" type="email" placeholder="Business email *" required />
            </label>

            <label>
              <span>Phone number</span>
              <input name="phone" type="tel" placeholder="Phone number" />
            </label>

            <label class="select-label">
              <span>How did you hear about us?</span>
              <select name="source">
                <option>Google search</option>
                <option>LinkedIn</option>
                <option>Referral</option>
                <option>Event or community</option>
                <option>Other</option>
              </select>
            </label>

            <label>
              <span>How can we help?</span>
              <textarea name="message" placeholder="How can we help?"></textarea>
            </label>

            <button class="form-submit" type="submit">Book an AI Governance Snapshot</button>
            <p class="form-note">Operational governance, not legal advice.</p>
          </form>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
